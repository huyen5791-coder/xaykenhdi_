<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const S = 640;
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(S,S);
renderer.setClearColor(0x000000,0);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
const env = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(30,1,0.1,100); camera.position.set(0,0,9);

const C = {cream:0xFBF8ED, green:0x4D5549, brown:0x4F3C35, lime:0xCDFD84, pink:0xF1A0D6, yellow:0xFFFD60};
const plastic = (c)=> new THREE.MeshPhysicalMaterial({color:c, roughness:0.28, metalness:0, clearcoat:1, clearcoatRoughness:0.08, envMapIntensity:0.55});
const chrome = ()=> new THREE.MeshPhysicalMaterial({color:0xF4F1FF, roughness:0.06, metalness:1, envMapIntensity:1.6, iridescence:0.9, iridescenceIOR:1.6});

function ext(shape, depth=0.55, bev=0.22, segs=8){
  const g = new THREE.ExtrudeGeometry(shape,{depth, bevelEnabled:true, bevelThickness:bev, bevelSize:bev*0.9, bevelSegments:segs, curveSegments:48});
  g.center(); return g;
}
function star(n=5, R=1.6, r=0.75){
  const s=new THREE.Shape();
  for(let i=0;i<n*2;i++){const a=Math.PI/2+i*Math.PI/n; const rr=i%2?r:R; const x=Math.cos(a)*rr,y=Math.sin(a)*rr; i?s.lineTo(x,y):s.moveTo(x,y);} return s;
}
function sparkle(R=1.9){
  const s=new THREE.Shape(); const k=0.18;
  s.moveTo(0,R);
  s.quadraticCurveTo(k,k,R,0); s.quadraticCurveTo(k,-k,0,-R);
  s.quadraticCurveTo(-k,-k,-R,0); s.quadraticCurveTo(-k,k,0,R); return s;
}
function heart(){
  const s=new THREE.Shape(); const x=0,y=0;
  s.moveTo(0,-1.5);
  s.bezierCurveTo(-0.6,-0.9,-1.75,-0.35,-1.75,0.55);
  s.bezierCurveTo(-1.75,1.35,-1.1,1.75,-0.6,1.75);
  s.bezierCurveTo(-0.2,1.75,0,1.45,0,1.2);
  s.bezierCurveTo(0,1.45,0.2,1.75,0.6,1.75);
  s.bezierCurveTo(1.1,1.75,1.75,1.35,1.75,0.55);
  s.bezierCurveTo(1.75,-0.35,0.6,-0.9,0,-1.5); return s;
}
function arrow(){
  const s=new THREE.Shape();
  s.moveTo(-0.55,1.8); s.lineTo(0.55,1.8); s.lineTo(0.55,0); s.lineTo(1.45,0); s.lineTo(0,-1.8); s.lineTo(-1.45,0); s.lineTo(-0.55,0); s.closePath(); return s;
}
function bubble(){
  const s=new THREE.Shape(); const w=1.9,h=1.25,r=0.9;
  s.moveTo(-w+r,h); s.lineTo(w-r,h); s.quadraticCurveTo(w,h,w,h-r); s.lineTo(w,-h+r); s.quadraticCurveTo(w,-h,w-r,-h);
  s.lineTo(-0.4,-h); s.lineTo(-1.25,-2.0); s.lineTo(-1.0,-h); s.lineTo(-w+r,-h); s.quadraticCurveTo(-w,-h,-w,-h+r);
  s.lineTo(-w,h-r); s.quadraticCurveTo(-w,h,-w+r,h); return s;
}

function build(type){
  const scene=new THREE.Scene(); scene.environment=env;
  const key=new THREE.DirectionalLight(0xffffff,1.1); key.position.set(-3,5,6); scene.add(key);
  const rim=new THREE.DirectionalLight(0xffffff,0.8); rim.position.set(4,-2,3); scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff,0.15));
  const grp=new THREE.Group(); scene.add(grp);
  if(type==='star'){ grp.add(new THREE.Mesh(ext(star(),0.5,0.32,10), plastic(C.yellow))); }
  if(type==='heart'){ grp.add(new THREE.Mesh(ext(heart(),0.55,0.38,12), plastic(C.pink))); }
  if(type==='sparkle'){ grp.add(new THREE.Mesh(ext(sparkle(),0.45,0.3,12), chrome())); }
  if(type==='arrow'){ grp.add(new THREE.Mesh(ext(arrow(),0.5,0.28,10), plastic(C.lime))); }
  if(type==='bubble'){
    grp.add(new THREE.Mesh(ext(bubble(),0.5,0.3,10), plastic(C.pink)));
    // three dots
    for(let i=-1;i<=1;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(0.28,48,32), plastic(C.cream)); d.position.set(i*0.85,0.05,0.62); grp.add(d);}
  }
  if(type==='ring'){ grp.add(new THREE.Mesh(new THREE.TorusGeometry(1.25,0.48,64,128), plastic(C.lime))); }
  if(type==='blob'){ // Y2K smiley ball
    const b=new THREE.Mesh(new THREE.SphereGeometry(1.55,96,64), plastic(C.yellow)); grp.add(b);
    const em=plastic(C.brown);
    for(const sx of [-0.5,0.5]){const e=new THREE.Mesh(new THREE.CapsuleGeometry(0.13,0.32,8,24),em); e.position.set(sx,0.35,1.43); grp.add(e);}
    const m=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.1,24,64,Math.PI),em); m.rotation.z=Math.PI; m.position.set(0,-0.1,1.38); m.rotation.x=-0.25; grp.add(m);
  }
  if(type==='cube'){ grp.add(new THREE.Mesh(new RoundedBoxGeometry(2,2,2,8,0.35), plastic(C.green))); }

  if(type==='pin'){
    const g=new THREE.Group();
    const top=new THREE.Mesh(new THREE.SphereGeometry(1.2,96,64), plastic(C.pink)); top.position.y=0.55; g.add(top);
    const cone=new THREE.Mesh(new THREE.ConeGeometry(1.03,1.9,96,1,true), plastic(C.pink)); cone.rotation.x=Math.PI; cone.position.y=-0.85; g.add(cone);
    const hole=new THREE.Mesh(new THREE.SphereGeometry(0.48,64,48), plastic(C.cream)); hole.position.set(0,0.62,0.9); g.add(hole);
    grp.add(g);
  }
  if(type==='clock'){
    const body=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,0.6,96), plastic(C.lime)); body.rotation.x=Math.PI/2; grp.add(body);
    const rim=new THREE.Mesh(new THREE.TorusGeometry(1.6,0.22,32,96), plastic(C.lime)); grp.add(rim);
    const face=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.35,0.1,96), plastic(C.cream)); face.rotation.x=Math.PI/2; face.position.z=0.3; grp.add(face);
    const em=plastic(C.brown);
    const h1=new THREE.Mesh(new RoundedBoxGeometry(0.18,0.85,0.12,4,0.06),em); h1.position.set(0,0.38,0.42); grp.add(h1);
    const h2=new THREE.Mesh(new RoundedBoxGeometry(0.16,1.1,0.12,4,0.06),em); h2.rotation.z=-Math.PI/3; h2.position.set(0.45,-0.26,0.45); grp.add(h2);
    const c=new THREE.Mesh(new THREE.SphereGeometry(0.16,32,24),plastic(C.pink)); c.position.z=0.48; grp.add(c);
    for(let i=0;i<12;i++){const a=i*Math.PI/6; const d=new THREE.Mesh(new THREE.SphereGeometry(i%3?0.05:0.09,16,12),em); d.position.set(Math.sin(a)*1.12,Math.cos(a)*1.12,0.38); grp.add(d);}
    const b1=new THREE.Mesh(new THREE.SphereGeometry(0.42,48,32,0,Math.PI*2,0,Math.PI/2), plastic(C.pink)); b1.position.set(-1.05,1.45,0); b1.rotation.z=0.6; grp.add(b1);
    const b2=b1.clone(); b2.position.x=1.05; b2.rotation.z=-0.6; grp.add(b2);

  if(type==='hourglass'){
    const cap=plastic(C.brown);
    for(const y of [1.6,-1.6]){const c=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.25,0.32,64),cap); c.position.y=y; grp.add(c);}
    const pts=[]; for(let i=0;i<=40;i++){const y=-1.45+2.9*i/40; const r=0.18+0.85*Math.pow(Math.abs(y)/1.45,0.9); pts.push(new THREE.Vector2(r,y));}
    const glass=new THREE.Mesh(new THREE.LatheGeometry(pts,64), new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:0.05,transmission:0.9,thickness:0.3,transparent:true,opacity:0.55,clearcoat:1}));
    grp.add(glass);
    const sp=[]; for(let i=0;i<=20;i++){const y=-1.45+0.9*i/20; const r=(0.18+0.85*Math.pow(Math.abs(y)/1.45,0.9))*0.92; sp.push(new THREE.Vector2(r,y));} sp.push(new THREE.Vector2(0,-0.55));
    grp.add(new THREE.Mesh(new THREE.LatheGeometry(sp,64), plastic(C.yellow)));
    const tp=[new THREE.Vector2(0,0.35)]; for(let i=0;i<=16;i++){const y=0.35+0.8*i/16; tp.push(new THREE.Vector2((0.18+0.85*Math.pow(y/1.45,0.9))*0.92,y));} tp.push(new THREE.Vector2(0,1.15));
    grp.add(new THREE.Mesh(new THREE.LatheGeometry(tp,64), plastic(C.yellow)));
    for(const x of [-1.05,1.05]){const r=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,3.2,24),cap); r.position.x=x; grp.add(r);}
  }
  if(type==='coins'){
    const m=new THREE.MeshPhysicalMaterial({color:C.yellow, roughness:0.22, metalness:0.35, clearcoat:1, envMapIntensity:0.7});
    for(let i=0;i<4;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,0.34,96),m); c.position.set((i%2?0.08:-0.06),-1.1+i*0.38,0); grp.add(c);
      const r=new THREE.Mesh(new THREE.TorusGeometry(1.2,0.07,16,96),m); r.rotation.x=Math.PI/2; r.position.copy(c.position); r.position.y+=0.17; grp.add(r);}
    const top=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,0.34,96),m); top.position.set(0.9,0.7,0.4); top.rotation.set(1.2,0,0.4); grp.add(top);
  }
  if(type==='warn'){
    const s=new THREE.Shape(); const R=1.9; const p=[0,1,2].map(i=>[Math.cos(Math.PI/2+i*2*Math.PI/3)*R,Math.sin(Math.PI/2+i*2*Math.PI/3)*R-0.3]);
    s.moveTo(p[0][0],p[0][1]); s.lineTo(p[1][0],p[1][1]); s.lineTo(p[2][0],p[2][1]); s.closePath();
    grp.add(new THREE.Mesh(ext(s,0.4,0.35,12), plastic(C.yellow)));
    const em=plastic(C.brown);
    const bar=new THREE.Mesh(new THREE.CapsuleGeometry(0.17,0.75,8,24),em); bar.position.set(0,0.0,0.6); grp.add(bar);

  }
  if(type==='check'){
    const s=new THREE.Shape(); s.moveTo(-1.6,0.1); s.lineTo(-0.9,-0.6); s.lineTo(-0.4,-0.1); s.lineTo(1.0,1.4); s.lineTo(1.7,0.7); s.lineTo(-0.4,-1.4); s.lineTo(-1.6,-0.2+0.3); s.closePath();
    grp.add(new THREE.Mesh(ext(s,0.5,0.3,10), plastic(C.lime)));
  }
  if(type==='mega'){
    const g=new THREE.Group();
    const cone=new THREE.Mesh(new THREE.CylinderGeometry(1.25,0.45,2.2,64,1,true), new THREE.MeshPhysicalMaterial({color:C.pink,roughness:0.28,clearcoat:1,side:THREE.DoubleSide,envMapIntensity:0.55})); cone.rotation.z=-Math.PI/2; g.add(cone);
    const lip=new THREE.Mesh(new THREE.TorusGeometry(1.25,0.13,24,64), plastic(C.pink)); lip.rotation.y=Math.PI/2; lip.position.x=1.1; g.add(lip);
    const back=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,0.6,48), plastic(C.cream)); back.rotation.z=Math.PI/2; back.position.x=-1.35; g.add(back);
    const h=new THREE.Mesh(new RoundedBoxGeometry(0.4,1.0,0.4,4,0.15), plastic(C.brown)); h.position.set(-0.6,-0.85,0); h.rotation.z=0.2; g.add(h);
    const inner=new THREE.Mesh(new THREE.CircleGeometry(1.15,64), plastic(C.cream)); inner.rotation.y=Math.PI/2; inner.position.x=1.05; g.add(inner);
    g.rotation.y=-0.5; grp.add(g);
  }

  if(type==='calc'){
    grp.add(new THREE.Mesh(new RoundedBoxGeometry(2.4,3.2,0.6,8,0.25), plastic(C.pink)));
    const scr=new THREE.Mesh(new RoundedBoxGeometry(1.9,0.75,0.2,4,0.08), plastic(C.green)); scr.position.set(0,0.95,0.3); grp.add(scr);
    const cols=[C.cream,C.cream,C.cream,C.yellow];
    for(let r=0;r<3;r++)for(let c=0;c<4;c++){const b=new THREE.Mesh(new RoundedBoxGeometry(0.38,0.38,0.2,4,0.1), plastic(r==2&&c==3?C.lime:cols[c])); b.position.set(-0.72+c*0.48,0.1-r*0.52,0.32); grp.add(b);}
  }

  if(type==='bulb'){
    const glass=new THREE.Mesh(new THREE.SphereGeometry(1.25,96,64), new THREE.MeshPhysicalMaterial({color:C.yellow,roughness:0.15,clearcoat:1,emissive:C.yellow,emissiveIntensity:0.25,envMapIntensity:0.6})); glass.position.y=0.45; grp.add(glass);
    const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.75,0.6,64), new THREE.MeshPhysicalMaterial({color:C.yellow,roughness:0.15,clearcoat:1,envMapIntensity:0.6})); neck.position.y=-0.75; grp.add(neck);
    for(let i=0;i<3;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(0.6,0.1,16,64), plastic(C.green)); r.rotation.x=Math.PI/2; r.position.y=-1.12-i*0.22; grp.add(r);}
    const base=new THREE.Mesh(new THREE.CylinderGeometry(0.58,0.35,0.7,48), plastic(C.green)); base.position.y=-1.4; grp.add(base);
    const fil=new THREE.Mesh(new THREE.TorusGeometry(0.32,0.06,12,48,Math.PI*1.4), plastic(C.brown)); fil.position.set(0,0.35,0); fil.rotation.z=-0.2; grp.add(fil);
  }
  if(type==='cursor'){
    const s=new THREE.Shape(); s.moveTo(-1.0,1.9); s.lineTo(-1.0,-1.1); s.lineTo(-0.3,-0.45); s.lineTo(0.25,-1.75); s.lineTo(0.8,-1.5); s.lineTo(0.25,-0.25); s.lineTo(1.15,-0.25); s.closePath();
    const out=new THREE.Mesh(ext(s,0.35,0.22,8), plastic(C.cream)); grp.add(out);
    const s2=new THREE.Shape(); const k=0.62; const pts=[[-1.0,1.9],[-1.0,-1.1],[-0.3,-0.45],[0.25,-1.75],[0.8,-1.5],[0.25,-0.25],[1.15,-0.25]];
    pts.forEach((p,i)=>{const x=p[0]*k-0.08,y=p[1]*k+0.1; i?s2.lineTo(x,y):s2.moveTo(x,y);}); s2.closePath();
    const inn=new THREE.Mesh(ext(s2,0.3,0.12,6), plastic(C.pink)); inn.position.z=0.28; grp.add(inn);
  }
  if(type==='magnifier'){
    const ring=new THREE.Mesh(new THREE.TorusGeometry(1.1,0.28,48,96), plastic(C.lime)); ring.position.set(-0.3,0.4,0); grp.add(ring);
    const lens=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.0,0.12,64), new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:0.03,transmission:0.95,thickness:0.4,clearcoat:1,transparent:true,opacity:0.5})); lens.rotation.x=Math.PI/2; lens.position.copy(ring.position); grp.add(lens);
    const h=new THREE.Mesh(new THREE.CapsuleGeometry(0.28,1.3,12,32), plastic(C.brown)); h.position.set(0.95,-1.05,0); h.rotation.z=Math.PI/4; grp.add(h);
  }

  if(type==='pencil'){
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,2.6,6), plastic(C.yellow)); g.add(body);
    const tipW=new THREE.Mesh(new THREE.ConeGeometry(0.42,0.8,6), plastic(C.cream)); tipW.position.y=-1.7; tipW.rotation.x=Math.PI; g.add(tipW);
    const lead=new THREE.Mesh(new THREE.ConeGeometry(0.15,0.3,24), plastic(C.brown)); lead.position.y=-2.0; lead.rotation.x=Math.PI; g.add(lead);
    const band=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,0.35,32), new THREE.MeshPhysicalMaterial({color:0xdddddd,metalness:1,roughness:0.2})); band.position.y=1.45; g.add(band);
    const er=new THREE.Mesh(new THREE.CapsuleGeometry(0.42,0.3,8,32), plastic(C.pink)); er.position.y=1.85; g.add(er);
    g.rotation.z=-0.7; grp.add(g);
  }
  if(type==='camera'){
    grp.add(new THREE.Mesh(new RoundedBoxGeometry(3.0,2.0,1.1,8,0.3), plastic(C.green)));
    const top=new THREE.Mesh(new RoundedBoxGeometry(1.0,0.5,0.8,4,0.15), plastic(C.green)); top.position.set(-0.7,1.1,0); grp.add(top);
    const ring=new THREE.Mesh(new THREE.CylinderGeometry(0.85,0.9,0.5,64), plastic(C.cream)); ring.rotation.x=Math.PI/2; ring.position.z=0.7; grp.add(ring);
    const lens=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,0.3,64), new THREE.MeshPhysicalMaterial({color:0x223322,roughness:0.05,clearcoat:1,metalness:0.3})); lens.rotation.x=Math.PI/2; lens.position.z=0.9; grp.add(lens);
    const dot=new THREE.Mesh(new THREE.SphereGeometry(0.17,24,16), plastic(C.pink)); dot.position.set(1.1,0.6,0.56); grp.add(dot);
    const flash=new THREE.Mesh(new RoundedBoxGeometry(0.5,0.3,0.15,3,0.06), plastic(C.yellow)); flash.position.set(0.9,1.02,0.2); grp.add(flash);
  }
  if(type==='play'){
    grp.add(new THREE.Mesh(new RoundedBoxGeometry(3.0,2.2,0.6,8,0.45), plastic(C.pink)));
    const s=new THREE.Shape(); s.moveTo(-0.45,0.65); s.lineTo(0.75,0); s.lineTo(-0.45,-0.65); s.closePath();
    const tri=new THREE.Mesh(ext(s,0.2,0.12,6), plastic(C.cream)); tri.position.z=0.42; grp.add(tri);
  }

  if(type==='cake'){
    const plate=new THREE.Mesh(new THREE.CylinderGeometry(1.9,1.8,0.18,96), plastic(C.cream)); plate.position.y=-1.2; grp.add(plate);
    const t1=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,1.1,96), plastic(C.pink)); t1.position.y=-0.55; grp.add(t1);
    const t2=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,0.85,96), plastic(C.cream)); t2.position.y=0.42; grp.add(t2);
    for(let i=0;i<16;i++){const a=i/16*Math.PI*2; const d=new THREE.Mesh(new THREE.SphereGeometry(0.2,24,16), plastic(C.cream)); d.position.set(Math.cos(a)*1.45,0.0,Math.sin(a)*1.45); d.scale.y=1.3; grp.add(d);}
    for(let i=0;i<12;i++){const a=i/12*Math.PI*2; const d=new THREE.Mesh(new THREE.SphereGeometry(0.15,24,16), plastic(C.lime)); d.position.set(Math.cos(a)*1.0,0.85,Math.sin(a)*1.0); grp.add(d);}
    const ch=new THREE.Mesh(new THREE.SphereGeometry(0.3,32,24), plastic(0xd9455f)); ch.position.y=1.1; grp.add(ch);
    const st=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.5,8), plastic(C.green)); st.position.set(0.12,1.45,0); st.rotation.z=-0.4; grp.add(st);
    const cd=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.8,24), plastic(C.yellow)); cd.position.set(-0.55,1.25,0.3); grp.add(cd);
    const fl=new THREE.Mesh(new THREE.SphereGeometry(0.12,16,16), new THREE.MeshBasicMaterial({color:0xffb347})); fl.scale.y=1.7; fl.position.set(-0.55,1.8,0.3); grp.add(fl);
    grp.rotation.x=0.35;
  }
  if(type==='pushpin'){
    const g=new THREE.Group(); const red=plastic(0xd9455f);
    const head=new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,0.4,64),red); head.position.y=1.3; g.add(head);
    const capT=new THREE.Mesh(new THREE.SphereGeometry(0.9,64,32,0,Math.PI*2,0,Math.PI/2),red); capT.scale.y=0.35; capT.position.y=1.5; g.add(capT);
    const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.55,1.1,48),red); neck.position.y=0.55; g.add(neck);
    const base=new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.8,0.3,64),red); base.position.y=-0.1; g.add(base);
    const needle=new THREE.Mesh(new THREE.ConeGeometry(0.08,1.4,16), new THREE.MeshPhysicalMaterial({color:0xdddddd,metalness:1,roughness:0.15})); needle.position.y=-0.95; needle.rotation.x=Math.PI; g.add(needle);
    g.rotation.z=0.5; grp.add(g);
  }
  if(type==='clip'){
    const pts=[[ -0.4,-1.6],[-0.4,1.2],[0.4,1.2],[0.4,-1.2],[-0.15,-1.2],[-0.15,0.8],[0.15,0.8],[0.15,-0.5]];
    const path=new THREE.CurvePath();
    const r=0.4;
    const curve=new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.15,-0.5,0),new THREE.Vector3(0.15,0.7,0),new THREE.Vector3(0.05,0.92,0),new THREE.Vector3(-0.15,0.7,0),
      new THREE.Vector3(-0.15,-1.15,0),new THREE.Vector3(0.0,-1.42,0),new THREE.Vector3(0.38,-1.2,0),new THREE.Vector3(0.42,1.1,0),
      new THREE.Vector3(0.0,1.6,0),new THREE.Vector3(-0.45,1.15,0),new THREE.Vector3(-0.45,-1.3,0)],false,'catmullrom',0.3);
    const m=new THREE.MeshPhysicalMaterial({color:0xe8e8ee,metalness:1,roughness:0.12,envMapIntensity:1.4});
    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,300,0.07,20,false),m); tube.scale.set(1.6,1.3,1.6); grp.add(tube);
    grp.rotation.z=-0.35;
  }
  if(type==='xmark'){
    for(const a of [Math.PI/4,-Math.PI/4]){const b=new THREE.Mesh(new RoundedBoxGeometry(0.85,3.4,0.75,6,0.35), plastic(0xF1A0D6)); b.rotation.z=a; grp.add(b);}
  }

  if(type==='eye'){
    const white=new THREE.Mesh(new THREE.SphereGeometry(1.4,96,64), plastic(C.cream)); white.scale.set(1.35,0.85,0.6); grp.add(white);
    const iris=new THREE.Mesh(new THREE.SphereGeometry(0.72,64,48), plastic(C.green)); iris.position.z=0.55; iris.scale.z=0.6; grp.add(iris);
    const pup=new THREE.Mesh(new THREE.SphereGeometry(0.36,48,32), plastic(C.brown)); pup.position.z=0.9; pup.scale.z=0.5; grp.add(pup);
    const hl=new THREE.Mesh(new THREE.SphereGeometry(0.12,24,16), new THREE.MeshBasicMaterial({color:0xffffff})); hl.position.set(0.22,0.2,1.08); grp.add(hl);
    for(const s of [1,-1]){const lid=new THREE.Mesh(new THREE.TorusGeometry(1.75,0.12,16,64,Math.PI*0.62), plastic(C.pink)); lid.rotation.z=s>0?Math.PI*0.19:Math.PI*1.19; lid.position.y=-s*0.85; lid.scale.y=0.9; grp.add(lid);}
  }
  if(type==='bottle'){
    const body=new THREE.Mesh(new THREE.CylinderGeometry(0.85,0.85,2.2,64), new THREE.MeshPhysicalMaterial({color:C.pink,roughness:0.1,transmission:0.4,thickness:0.8,clearcoat:1,envMapIntensity:0.7})); body.position.y=-0.5; grp.add(body);
    const sh=new THREE.Mesh(new THREE.SphereGeometry(0.85,64,32,0,Math.PI*2,0,Math.PI/2), body.material); sh.position.y=0.6; sh.scale.y=0.45; grp.add(sh);
    const label=new THREE.Mesh(new THREE.CylinderGeometry(0.87,0.87,0.9,64,1,true), plastic(C.cream)); label.position.y=-0.6; grp.add(label);
    const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.38,0.45,32), plastic(C.green)); neck.position.y=1.15; grp.add(neck);
    const pump=new THREE.Mesh(new RoundedBoxGeometry(0.5,0.35,0.5,4,0.12), plastic(C.green)); pump.position.y=1.65; grp.add(pump);
    const st=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.35,16), plastic(C.green)); st.position.y=1.35; grp.add(st);
    const noz=new THREE.Mesh(new THREE.CapsuleGeometry(0.1,0.5,6,16), plastic(C.green)); noz.rotation.z=Math.PI/2; noz.position.set(0.45,1.65,0); grp.add(noz);
  }
  if(type==='drop'){
    const pts=[]; for(let i=0;i<=60;i++){const t=i/60; const a=t*Math.PI; const r=Math.sin(a)*(1-0.55*t)*1.15; pts.push(new THREE.Vector2(Math.max(0,r), 1.7-t*3.2 - (t>0.6? (t-0.6)*0.0:0)));}
    const g=new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p.x,p.y)),96); 
    const m=new THREE.Mesh(g,new THREE.MeshPhysicalMaterial({color:0xBFE8FF,roughness:0.03,transmission:0.7,thickness:1.2,clearcoat:1,envMapIntensity:1.0})); m.rotation.z=Math.PI; grp.add(m);
  }
  if(type==='trophy'){
    const gold=new THREE.MeshPhysicalMaterial({color:C.yellow,metalness:0.75,roughness:0.18,clearcoat:1,envMapIntensity:1.1});
    const cup=new THREE.Mesh(new THREE.CylinderGeometry(1.15,0.55,1.5,64,1,false), gold); cup.position.y=0.7; grp.add(cup);
    const bowl=new THREE.Mesh(new THREE.SphereGeometry(0.56,48,32,0,Math.PI*2,Math.PI/2,Math.PI/2), gold); bowl.position.y=-0.05; grp.add(bowl);
    for(const s of [1,-1]){const h=new THREE.Mesh(new THREE.TorusGeometry(0.45,0.11,16,48,Math.PI*1.2), gold); h.position.set(s*1.15,0.75,0); h.rotation.z=s>0?-Math.PI*0.6:Math.PI*1.6; grp.add(h);}
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,0.7,32), gold); stem.position.y=-0.6; grp.add(stem);
    const base=new THREE.Mesh(new RoundedBoxGeometry(1.4,0.45,0.9,4,0.12), plastic(C.green)); base.position.y=-1.15; grp.add(base);
    const st=new THREE.Shape(); for(let i=0;i<10;i++){const a=Math.PI/2+i*Math.PI/5; const r=i%2?0.16:0.36; i?st.lineTo(Math.cos(a)*r,Math.sin(a)*r):st.moveTo(Math.cos(a)*r,Math.sin(a)*r);} 
    const star=new THREE.Mesh(ext(st,0.06,0.04,4), plastic(C.pink)); star.position.set(0,0.75,1.0); grp.add(star);
  }
  return {scene,grp};
}
const cache={};
window.render=(type,t)=>{
  const o=cache[type]||(cache[type]=build(type));
  const a=Math.sin(t*Math.PI*2);
  o.grp.rotation.set(0.25+0.12*Math.cos(t*Math.PI*2), (type==='ring'||type==='cube'?0.6:0)+0.55*a, (type==='cube'?0.5:-0.08));
  if(type==='ring') o.grp.rotation.x=0.9+0.15*a;
  renderer.render(o.scene,camera);
  return renderer.domElement.toDataURL('image/png');
};
window.ready=true;
</script></body></html>
